<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prey.Wtf | Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07080e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .sub {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 32px;
        }
        .status {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 40px;
            display: inline-block;
            margin-bottom: 24px;
        }
        .status .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 12px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .status span { color: #e2e8f0; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
        .loader-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px 24px;
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
            overflow: hidden;
        }
        .loader-box code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
            white-space: pre-wrap;
            line-height: 1.8;
            display: block;
        }
        .loader-box .key {
            color: #f472b6;
        }
        .loader-box .string {
            color: #34d399;
        }
        .loader-box .comment {
            color: #475569;
            font-style: italic;
        }
        .btn {
            background: #ffffff;
            color: #07080e;
            border: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-block;
            text-decoration: none;
            margin: 4px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
        }
        .btn-outline {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: none;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .footer {
            margin-top: 40px;
            color: #475569;
            font-size: 12px;
            letter-spacing: 2px;
        }
        .footer a {
            color: #38bdf8;
            text-decoration: none;
        }
        .config-preview {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #64748b;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 28px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .sub { font-size: 14px; }
            .loader-box code { font-size: 10px; }
            .btn { padding: 10px 20px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prey.Wtf</h1>
        <p class="sub">Roblox Cheat Suite — Dashboard v2.1</p>

        <div class="status">
            <span class="dot"></span>
            <span>System Online</span>
        </div>

        <div class="loader-box">
            <code>
<span class="comment">-- Prey Loader v2.1</span>
<span class="comment">-- Copy this and paste into your executor</span>

<span class="key">getgenv</span>().<span class="key">script_key</span> = <span class="string">"YOUR_KEY_HERE"</span>
<span class="key">loadstring</span>(<span class="key">game</span>:<span class="key">HttpGet</span>(<span class="string">"https://prey.wtf/loader.lua"</span>))()
            </code>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="copyLoader()"><i class="fa-regular fa-copy"></i> Copy Loader</button>
            <button class="btn btn-outline" onclick="openConfig()"><i class="fa-regular fa-file-lines"></i> View Config</button>
        </div>

        <div id="configPreview" class="config-preview" style="display:none;">
            <div style="color:#94a3b8; font-size:11px; font-weight:600; margin-bottom:6px;">📋 ACTIVE CONFIG</div>
            <div id="configContent">Loading...</div>
        </div>

        <p class="footer">
            <a href="#" onclick="alert('Discord: discord.gg/preywtf')">Discord</a> &middot;
            <a href="#" onclick="alert('v2.1.0')">Version 2.1.0</a> &middot;
            <a href="#" onclick="alert('Made with ❤️')">About</a>
        </p>
    </div>

    <div id="toast" class="toast">Copied!</div>

    <script>
        const API_BASE = 'https://prey.wtf';

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
        }

        function copyLoader() {
            const key = prompt('Enter your license key:', 'XxcVYIWfftLoPaiJPGzsXMIBtfZdZhua');
            if (key === null) return;
            const text = `getgenv().script_key = "${key.trim()}"\nloadstring(game:HttpGet("${API_BASE}/loader.lua"))()`;
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ Loader copied to clipboard!');
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast('✅ Loader copied!');
            });
        }

        async function openConfig() {
            const preview = document.getElementById('configPreview');
            const content = document.getElementById('configContent');

            if (preview.style.display === 'block') {
                preview.style.display = 'none';
                return;
            }

            preview.style.display = 'block';
            content.textContent = 'Loading config...';

            try {
                const key = prompt('Enter your license key to view config:', 'XxcVYIWfftLoPaiJPGzsXMIBtfZdZhua');
                if (!key) {
                    preview.style.display = 'none';
                    return;
                }
                const res = await fetch(`${API_BASE}/api/configs?key=${encodeURIComponent(key)}`);
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    const config = data.find(c => c.name === 'Default') || data[0];
                    content.textContent = config.content || 'Empty config';
                } else {
                    content.textContent = 'No configs found. Try loading the script first.';
                }
            } catch (e) {
                content.textContent = '⚠️ Could not load config. Make sure the backend is running.';
                console.error(e);
            }
        }

        // Auto-load config on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Check if key exists in URL params
            const params = new URLSearchParams(window.location.search);
            const key = params.get('key');
            if (key) {
                document.querySelector('.loader-box code').innerHTML = `
                    <span class="comment">-- Prey Loader v2.1</span>
                    <span class="comment">-- Key loaded from URL</span>
                    <span class="key">getgenv</span>().<span class="key">script_key</span> = <span class="string">"${key}"</span>
                    <span class="key">loadstring</span>(<span class="key">game</span>:<span class="key">HttpGet</span>(<span class="string">"${API_BASE}/loader.lua"</span>))()
                `;
            }
        });
    </script>
</body>
</html>
